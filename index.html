<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Làm phần mềm Quản lý học sinh bằng Tkinter – Logiscool</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--magenta:#A50050;--lime:#C4D600;--blue:#009FE3;--bg:#F6F8FB;--card:#fff;--ink:#1c2233;--mute:#5b6478;--line:#dfe4ee;--code:#161b2b;--codeink:#e8ecf7;--accent:var(--magenta);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--card:#1b2030;--ink:#eef1f8;--mute:#a3acc2;--line:#2c3348;--accent:#ff5fa2}}
:root[data-theme="dark"]{--bg:#12151f;--card:#1b2030;--ink:#eef1f8;--mute:#a3acc2;--line:#2c3348;--accent:#ff5fa2}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.65 Nunito,system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img{-webkit-user-drag:none;pointer-events:none}
header{background:var(--card);border-bottom:6px solid var(--blue);padding:18px 20px}
.wrap{max-width:1080px;margin:0 auto}
.brand{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:space-between}
.logo{background:#fff;border-radius:12px;padding:8px 12px;border:1px solid var(--line)}
.logo img{display:block;height:44px;width:auto;max-width:100%}
h1{font-size:clamp(1.5rem,4vw,2.3rem);line-height:1.2;margin:18px 0 6px;font-weight:800}
.sub{color:var(--mute);margin:0;max-width:62ch}
#theme{border:2px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:6px 14px;font:600 14px Nunito,sans-serif;cursor:pointer}
.bar{height:12px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--magenta),var(--blue),var(--lime));transition:width .4s}
.pct{font-size:14px;color:var(--mute);margin-top:6px}
main.wrap{display:grid;grid-template-columns:270px 1fr;gap:24px;padding:24px 20px 60px}
nav ol{list-style:none;margin:0;padding:0;position:sticky;top:12px;display:grid;gap:6px}
nav button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 12px;font:600 15px Nunito,sans-serif;cursor:pointer}
nav button[aria-current="step"]{border-color:var(--accent);box-shadow:4px 4px 0 var(--blue)}
nav .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-size:14px;font-weight:800}
nav .done .n{background:var(--lime);color:#222}
article{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:26px;min-width:0}
article h2{margin:0 0 4px;font-size:1.6rem;color:var(--accent);font-weight:800}
.lead{margin:0 0 14px;font-weight:600}
.ana{background:color-mix(in srgb,var(--blue) 12%,transparent);border-left:6px solid var(--blue);border-radius:10px;padding:10px 14px;margin:0 0 18px;font-size:16px}
.blk{margin:22px 0}
.blk h3{font-size:1.05rem;margin:0 0 8px}
.blk p{margin:0 0 10px}
pre{margin:0;background:var(--code);color:var(--codeink);border-radius:12px;padding:16px;overflow-x:auto;font:400 14px/1.55 "Fira Code",ui-monospace,Menlo,monospace;border-left:6px solid var(--lime)}
.ex{margin-top:12px;display:grid;gap:6px}
.ex b{font-size:15px}
.ex div{display:grid;grid-template-columns:minmax(0,42%) 1fr;gap:12px;background:color-mix(in srgb,var(--lime) 14%,var(--card));border-radius:10px;padding:8px 12px;font-size:15px;line-height:1.5}
.ex code{font:500 13px "Fira Code",ui-monospace,monospace;color:var(--accent);word-break:break-word}
.tip{background:color-mix(in srgb,var(--lime) 22%,transparent);border-left:6px solid var(--lime);border-radius:10px;padding:10px 14px;margin:14px 0;font-size:15px}
.chk{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.chk label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.chk input,.mark input{width:20px;height:20px;accent-color:var(--magenta);flex:none;margin-top:3px}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:26px;padding-top:18px;border-top:2px dashed var(--line)}
.mark{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.btns{display:flex;gap:10px}
.btn{border:0;border-radius:12px;padding:10px 20px;font:800 16px Nunito,sans-serif;cursor:pointer;background:var(--magenta);color:#fff}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.win{border:2px solid var(--ink);border-radius:10px;overflow:hidden;font-size:13px;max-width:520px}
.win .wt{background:var(--blue);color:#fff;padding:4px 10px;font-weight:700}
.win .b{padding:10px;background:#fff;color:#222;display:grid;gap:6px}
.win .r{display:flex;gap:6px;flex-wrap:wrap}
.win span{border:1px solid #999;border-radius:4px;padding:2px 8px;background:#f2f2f2}
.win .g{background:var(--lime);border-color:var(--lime);font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--magenta);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (max-width:820px){main.wrap{grid-template-columns:1fr}nav ol{position:static;grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;padding-bottom:6px}nav button{width:auto}nav .tx{display:none}.ex div{grid-template-columns:1fr;gap:2px}}
@media (prefers-reduced-motion:reduce){.bar i,#toast{transition:none}}
@media print{body{display:none}}
</style>
</head>

S002|Trần Thị Bình|13||Lớp Scratch`},
{h:"Bước 2.2 – Gõ đoạn code này ngay dưới phần import",p:"Ta gom mọi thứ vào một 'lớp' (class) tên StudentApp. Hàm __init__ chạy đầu tiên khi mở phần mềm. Hai hàm read_all và write_all là 'thủ thư': một người đọc sổ, một người ghi sổ. Các chức năng sau này chỉ việc nhờ hai người này.",a:1,c:`class StudentApp:
    def __init__(self, root):
        self.root = root                       # cửa sổ chính
        root.title("Quản lý học sinh")         # tiêu đề cửa sổ
        root.geometry("820x520")               # rộng 820, cao 520
        self.filename = "students.txt"         # tên file lưu dữ liệu
        self.selected_id = None                # chưa chọn ai cả
        self.create_widgets()                  # 1. vẽ giao diện
        self.load_students()                   # 2. hiện danh sách

    def read_all(self):
        students = []                          # danh sách rỗng
        if not os.path.exists(self.filename):  # chưa có file thì trả về rỗng
            return students
        with open(self.filename, "r", encoding="utf-8") as f:
            for line in f:                     # đọc từng dòng
                line = line.strip()            # bỏ ký tự xuống dòng
                if line:                       # bỏ qua dòng trống
                    students.append(line.split("|"))
        return students

    def write_all(self, students):
        with open(self.filename, "w", encoding="utf-8") as f:
            for s in students:                 # ghi từng học sinh một dòng
                f.write("|".join(s) + "\\n")`,

b:[{h:"Bước 3.1 – Viết hàm create_widgets (thụt vào 4 dấu cách, nằm trong class)",p:"Vòng lặp for giúp em tạo 5 ô nhập chỉ với vài dòng, thay vì viết lặp lại 5 lần.",a:1,c:`    def create_widgets(self):

else if(x.c){const pre=el("pre");pre.textContent=x.c.replace(/^\n/,"");d.append(pre)}
if(x.x){const ex=el("div","ex");ex.append(el("b",0,"Giải thích các dòng quan trọng:"));x.x.forEach(r=>{const row=el("div");row.append(el("code",0,r[0]),el("span",0,r[1]));ex.append(row)});d.append(ex)}
if(x.k){const ul=el("ul","chk");x.k.forEach((k,ki)=>{const key=cur+"-"+ki,li=el("li"),lb=el("label"),cbx=el("input");cbx.type="checkbox";cbx.checked=!!ticks[key];
cbx.onchange=()=>{ticks[key]=cbx.checked;save()};lb.append(cbx,el("span",0,k));li.append(lb);ul.append(li)});d.append(ul)}
a.append(d)});
if(s.tip)a.append(el("div","tip","Lưu ý: "+s.tip));
const f=el("div","foot"),m=el("label","mark"),mc=el("input");mc.type="checkbox";mc.checked=done[cur];
mc.onchange=()=>{done[cur]=mc.checked;save();nav();prog()};m.append(mc,el("span",0,"Em đã hiểu bước này"));
const bt=el("div","btns"),pv=el("button","btn alt","Quay lại"),nx=el("button","btn",cur===S.length-1?"Hoàn thành":"Bước tiếp theo");
pv.type=nx.type="button";pv.disabled=cur===0;pv.onclick=()=>go(cur-1);
nx.onclick=()=>{done[cur]=true;save();if(cur<S.length-1)go(cur+1);else{nav();prog();render()}};
bt.append(pv,nx);f.append(m,bt);a.append(f);
if(cur===S.length-1&&done.every(Boolean)){a.insertBefore(el("div","tip","Chúc mừng em! Phần mềm quản lý học sinh đã hoàn thành. Create. Code. Enjoy."),f)}}
function go(i){cur=Math.max(0,Math.min(S.length-1,i));save();nav();prog();render();window.scrollTo({top:0,behavior:"smooth"})}
$("theme").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
/* Chặn sao chép: bôi đen, Ctrl+C, chuột phải, kéo thả */
let tt;function toast(){const t=$("toast");t.textContent="Hãy tự tay gõ code nhé, em sẽ nhớ lâu hơn!";t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}
["copy","cut"].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();try{e.clipboardData.setData("text/plain","Hãy tự tay gõ code nhé!")}catch(x){}toast()}));
["contextmenu","selectstart","dragstart"].forEach(n=>document.addEventListener(n,e=>{e.preventDefault();if(n==="contextmenu")toast()}));
document.addEventListener("keydown",e=>{const k=(e.key||"").toLowerCase();if(((e.ctrlKey||e.metaKey)&&["c","x","a","u","s","p"].includes(k))||(e.ctrlKey&&k==="insert")){e.preventDefault();toast()}});
nav();prog();render();
</script>
